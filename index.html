<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Echo Room</title>
<style>
  :root{
    --void: #05050a;
    --void-2: #0a0b16;
    --ember: #ffb37a;
    --ember-dim: #a8703f;
    --violet: #8aa2ff;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.12);
    --text-dim: rgba(230,230,240,0.55);
  }
  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body{
    margin:0; padding:0; overflow:hidden;
    width:100%; height:100%;
    background: var(--void);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    color: #eaeaf2;
    touch-action: none;
  }
  #canvas-wrap{ position:fixed; inset:0; }
  canvas{ display:block; width:100%; height:100%; }

  /* ---- HUD ---- */
  #hud-top{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 14px); left:50%;
    transform:translateX(-50%);
    display:flex; gap:8px; align-items:center;
    padding:8px 16px; border-radius:999px;
    background: var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    font-size:12px; letter-spacing:0.04em; color: var(--text-dim);
    pointer-events:none;
    z-index:10;
  }
  #hud-top b{ color:#fff; font-weight:600; }

  #intro{
    position:fixed; inset:0; z-index:40;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
    background: radial-gradient(ellipse at 50% 30%, #12131f 0%, var(--void) 70%);
    transition: opacity 0.8s ease;
  }
  #intro h1{
    font-size:28px; font-weight:300; letter-spacing:0.08em; margin:0 0 6px;
    background: linear-gradient(135deg, #fff, var(--violet));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  #intro p{
    font-size:14px; color: var(--text-dim); max-width:280px; line-height:1.6; margin:0 0 28px;
  }
  #enter-btn{
    padding:14px 36px; border-radius:999px; border:1px solid var(--glass-border);
    background: var(--glass); color:#fff; font-size:14px; letter-spacing:0.06em;
    backdrop-filter: blur(12px);
  }
  #intro.hidden{ opacity:0; pointer-events:none; }

  /* ---- Look layer (right side drag) ---- */
  #look-layer{ position:fixed; inset:0; z-index:5; }

  /* ---- Joystick ---- */
  #joystick-zone{
    position:fixed; left:0; bottom:0; width:46%; height:46%; z-index:20;
  }
  #joystick-base{
    position:absolute; width:104px; height:104px; border-radius:50%;
    background: var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    display:none;
  }
  #joystick-nub{
    position:absolute; width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.25);
    left:30px; top:30px;
  }

  /* ---- Record button ---- */
  #record-wrap{
    position:fixed; right:calc(env(safe-area-inset-right,0px) + 22px);
    bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
    z-index:20; display:flex; flex-direction:column; align-items:center; gap:8px;
  }
  #record-btn{
    width:72px; height:72px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8f5c, var(--ember-dim));
    border:1px solid rgba(255,255,255,0.25);
    box-shadow: 0 0 0 0 rgba(255,179,122,0.5);
    display:flex; align-items:center; justify-content:center;
    transition: transform 0.15s ease;
  }
  #record-btn svg{ width:26px; height:26px; fill:#1a0f08; }
  #record-btn.recording{
    transform:scale(1.08);
    animation: pulse-ring 1.1s ease-out infinite;
  }
  @keyframes pulse-ring{
    0%{ box-shadow: 0 0 0 0 rgba(255,143,92,0.55); }
    100%{ box-shadow: 0 0 0 26px rgba(255,143,92,0); }
  }
  #record-label{
    font-size:11px; color: var(--text-dim); letter-spacing:0.04em;
    background: var(--glass); padding:4px 10px; border-radius:999px;
    border:1px solid var(--glass-border);
  }

  /* ---- Near-memory caption ---- */
  #memory-caption{
    position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 130px);
    transform:translateX(-50%) translateY(8px);
    padding:10px 18px; border-radius:14px;
    background: var(--glass); border:1px solid var(--glass-border);
    backdrop-filter: blur(14px);
    font-size:13px; color:#fff; text-align:center; max-width:260px;
    opacity:0; transition: opacity 0.4s ease, transform 0.4s ease;
    z-index:15; pointer-events:none;
  }
  #memory-caption.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #permission-btn{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 60px); left:50%;
    transform:translateX(-50%);
    z-index:30; font-size:11px; padding:6px 14px; border-radius:999px;
    background: var(--glass); border:1px solid var(--glass-border); color:var(--text-dim);
    display:none;
  }
</style>
</head>
<body>

<div id="canvas-wrap"></div>
<div id="look-layer"></div>

<div id="hud-top">ความทรงจำในห้อง&nbsp;<b id="mem-count">0</b></div>
<button id="permission-btn">เปิดการเอียงมือถือ</button>

<div id="memory-caption"></div>

<div id="joystick-zone">
  <div id="joystick-base">
    <div id="joystick-nub"></div>
  </div>
</div>

<div id="record-wrap">
  <div id="record-btn">
    <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
  </div>
  <div id="record-label">กดค้างเพื่อพูด</div>
</div>

<div id="intro">
  <h1>ECHO ROOM</h1>
  <p>ห้องว่างที่จำเสียงคุณไว้<br>ไม่มี feed ไม่มี timeline<br>ต้องเดินเข้าไปหาเสียงเก่าๆ ถึงจะได้ยินมันอีกครั้ง</p>
  <button id="enter-btn">เข้าห้อง</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  // ------------------------------------------------------------------
  // IndexedDB persistence
  // ------------------------------------------------------------------
  const DB_NAME = "echoRoomDB";
  const STORE = "memories";
  let db;

  function openDB(){
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const database = e.target.result;
        if(!database.objectStoreNames.contains(STORE)){
          database.createObjectStore(STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = (e) => reject(e);
    });
  }

  function putMemory(mem){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).put(mem);
      tx.oncomplete = () => resolve();
      tx.onerror = (e) => reject(e);
    });
  }

  function getAllMemories(){
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = (e) => reject(e);
    });
  }

  // ------------------------------------------------------------------
  // Audio: mic recording, synth fallback, echo playback
  // ------------------------------------------------------------------
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    return audioCtx;
  }

  let mediaRecorder = null;
  let recordedChunks = [];
  let micStream = null;

  async function startMicRecording(){
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(micStream);
    mediaRecorder.ondataavailable = (e) => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();
  }

  function stopMicRecording(){
    return new Promise((resolve) => {
      if(!mediaRecorder){ resolve(null); return; }
      mediaRecorder.onstop = () => {
        micStream.getTracks().forEach(t => t.stop());
        const blob = new Blob(recordedChunks, { type: "audio/webm" });
        blob.arrayBuffer().then(resolve);
      };
      mediaRecorder.stop();
    });
  }

  // synth fallback: text -> tone burst sequence -> WAV ArrayBuffer
  async function synthesizeFromText(text){
    text = text || "echo";
    const sr = 22050;
    const duration = Math.min(4, 1 + text.length * 0.12);
    const offline = new OfflineAudioContext(1, Math.floor(sr * duration), sr);
    const gainMaster = offline.createGain();
    gainMaster.gain.value = 0.35;
    gainMaster.connect(offline.destination);

    for(let i = 0; i < text.length; i++){
      const ch = text.charCodeAt(i);
      const freq = 90 + (ch % 40) * 14;
      const start = i * 0.15;
      if(start > duration) break;
      const osc = offline.createOscillator();
      osc.type = "sine";
      osc.frequency.value = freq;
      const g = offline.createGain();
      g.gain.setValueAtTime(0, start);
      g.gain.linearRampToValueAtTime(0.5, start + 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, start + 0.28);
      osc.connect(g);
      g.connect(gainMaster);
      osc.start(start);
      osc.stop(start + 0.3);
    }
    const rendered = await offline.startRendering();
    return audioBufferToWav(rendered);
  }

  function audioBufferToWav(buffer){
    const numCh = buffer.numberOfChannels;
    const sr = buffer.sampleRate;
    const samples = buffer.length;
    const bytesPerSample = 2;
    const blockAlign = numCh * bytesPerSample;
    const dataSize = samples * blockAlign;
    const bufferArr = new ArrayBuffer(44 + dataSize);
    const view = new DataView(bufferArr);

    function writeStr(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }

    writeStr(0, "RIFF");
    view.setUint32(4, 36 + dataSize, true);
    writeStr(8, "WAVE");
    writeStr(12, "fmt ");
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);
    view.setUint16(22, numCh, true);
    view.setUint32(24, sr, true);
    view.setUint32(28, sr * blockAlign, true);
    view.setUint16(32, blockAlign, true);
    view.setUint16(34, 16, true);
    writeStr(36, "data");
    view.setUint32(40, dataSize, true);

    let offset = 44;
    const chData = [];
    for(let c=0;c<numCh;c++) chData.push(buffer.getChannelData(c));
    for(let i=0;i<samples;i++){
      for(let c=0;c<numCh;c++){
        let s = Math.max(-1, Math.min(1, chData[c][i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        offset += 2;
      }
    }
    return bufferArr;
  }

  // play stored ArrayBuffer with a real-time echo/feedback-delay effect
  async function playWithEcho(arrayBuffer){
    const ctx = getAudioCtx();
    if(ctx.state === "suspended") await ctx.resume();
    let audioBuf;
    try{
      audioBuf = await ctx.decodeAudioData(arrayBuffer.slice(0));
    }catch(err){
      console.warn("decode failed", err);
      return;
    }
    const src = ctx.createBufferSource();
    src.buffer = audioBuf;

    const dry = ctx.createGain();
    dry.gain.value = 0.9;

    const delay = ctx.createDelay(2.0);
    delay.delayTime.value = 0.28;
    const feedback = ctx.createGain();
    feedback.gain.value = 0.42;
    const wet = ctx.createGain();
    wet.gain.value = 0.55;

    src.connect(dry);
    dry.connect(ctx.destination);

    src.connect(delay);
    delay.connect(feedback);
    feedback.connect(delay);
    delay.connect(wet);
    wet.connect(ctx.destination);

    src.start();
  }

  // ------------------------------------------------------------------
  // Three.js scene
  // ------------------------------------------------------------------
  const wrap = document.getElementById("canvas-wrap");
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x05050a, 0.045);

  const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.05, 200);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x05050a, 1);
  wrap.appendChild(renderer.domElement);

  // player rig: yaw group holds pitch group holds camera
  const yawGroup = new THREE.Object3D();
  const pitchGroup = new THREE.Object3D();
  yawGroup.add(pitchGroup);
  pitchGroup.add(camera);
  scene.add(yawGroup);
  yawGroup.position.set(0, 0, 6);

  // ambient dust
  function makeDust(){
    const count = 900;
    const positions = new Float32Array(count * 3);
    for(let i=0;i<count;i++){
      positions[i*3+0] = (Math.random()-0.5) * 70;
      positions[i*3+1] = (Math.random()-0.5) * 40;
      positions[i*3+2] = (Math.random()-0.5) * 70;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
    const mat = new THREE.PointsMaterial({ color: 0x6677aa, size: 0.05, transparent:true, opacity:0.55 });
    return new THREE.Points(geo, mat);
  }
  scene.add(makeDust());

  // soft glow sprite texture
  function glowTexture(hexColor){
    const c = document.createElement("canvas");
    c.width = c.height = 128;
    const ctx2 = c.getContext("2d");
    const grad = ctx2.createRadialGradient(64,64,0,64,64,64);
    grad.addColorStop(0, hexColor + "ff");
    grad.addColorStop(0.4, hexColor + "88");
    grad.addColorStop(1, hexColor + "00");
    ctx2.fillStyle = grad;
    ctx2.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  }
  const glowTexBlue = glowTexture("#8aa2ff");
  const glowTexEmber = glowTexture("#ffb37a");

  // memory objects
  const memoryMeshes = []; // { data, group, core, glow }

  function addMemoryToScene(mem){
    const group = new THREE.Group();
    group.position.set(mem.x, mem.y, mem.z);

    const core = new THREE.Mesh(
      new THREE.SphereGeometry(0.12, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0x8aa2ff })
    );
    group.add(core);

    const glow = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTexBlue, transparent:true, opacity:0.8, blending: THREE.AdditiveBlending
    }));
    glow.scale.set(1.4, 1.4, 1.4);
    group.add(glow);

    scene.add(group);
    memoryMeshes.push({ data: mem, group, core, glow });
    document.getElementById("mem-count").textContent = memoryMeshes.length;
  }

  // ------------------------------------------------------------------
  // Look controls (drag on right/whole screen)
  // ------------------------------------------------------------------
  let yaw = 0, pitch = 0;
  const lookLayer = document.getElementById("look-layer");
  let looking = false, lastX = 0, lastY = 0;

  lookLayer.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    if(t.clientX < window.innerWidth * 0.42 && t.clientY > window.innerHeight * 0.5) return; // joystick zone
    looking = true; lastX = t.clientX; lastY = t.clientY;
  }, { passive:true });

  lookLayer.addEventListener("touchmove", (e) => {
    if(!looking) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - lastX, dy = t.clientY - lastY;
    lastX = t.clientX; lastY = t.clientY;
    yaw -= dx * 0.0032;
    pitch -= dy * 0.0032;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  }, { passive:true });

  lookLayer.addEventListener("touchend", () => { looking = false; });

  // mouse fallback (desktop testing)
  let mouseDown = false;
  lookLayer.addEventListener("mousedown", (e) => { mouseDown = true; lastX = e.clientX; lastY = e.clientY; });
  window.addEventListener("mousemove", (e) => {
    if(!mouseDown) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yaw -= dx * 0.0032;
    pitch -= dy * 0.0032;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  });
  window.addEventListener("mouseup", () => { mouseDown = false; });

  // gyroscope (optional, additive subtle sway)
  let gyroYaw = 0, gyroPitch = 0, gyroEnabled = false;
  function enableGyro(){
    window.addEventListener("deviceorientation", (e) => {
      if(e.gamma === null) return;
      gyroYaw = THREE.MathUtils.degToRad(e.gamma || 0) * 0.4;
      gyroPitch = THREE.MathUtils.degToRad((e.beta || 0) - 45) * 0.15;
    });
    gyroEnabled = true;
  }
  const permBtn = document.getElementById("permission-btn");
  if(typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function"){
    permBtn.style.display = "block";
    permBtn.addEventListener("click", () => {
      DeviceOrientationEvent.requestPermission().then((res) => {
        if(res === "granted"){ enableGyro(); permBtn.style.display = "none"; }
      }).catch(()=>{});
    });
  } else if(window.DeviceOrientationEvent){
    enableGyro();
  }

  // ------------------------------------------------------------------
  // Joystick (movement)
  // ------------------------------------------------------------------
  const joyZone = document.getElementById("joystick-zone");
  const joyBase = document.getElementById("joystick-base");
  const joyNub = document.getElementById("joystick-nub");
  let joyActive = false, joyOrigin = {x:0,y:0}, joyVec = {x:0,y:0};
  const JOY_RADIUS = 52;

  joyZone.addEventListener("touchstart", (e) => {
    const t = e.changedTouches[0];
    joyActive = true;
    joyOrigin = { x: t.clientX, y: t.clientY };
    joyBase.style.display = "block";
    joyBase.style.left = (t.clientX - 52) + "px";
    joyBase.style.top = (t.clientY - 52) + "px";
    joyNub.style.left = "30px"; joyNub.style.top = "30px";
  }, { passive:true });

  joyZone.addEventListener("touchmove", (e) => {
    if(!joyActive) return;
    const t = e.changedTouches[0];
    let dx = t.clientX - joyOrigin.x, dy = t.clientY - joyOrigin.y;
    const dist = Math.min(JOY_RADIUS, Math.hypot(dx,dy));
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang) * dist; dy = Math.sin(ang) * dist;
    joyNub.style.left = (30+dx) + "px"; joyNub.style.top = (30+dy) + "px";
    joyVec = { x: dx / JOY_RADIUS, y: dy / JOY_RADIUS };
  }, { passive:true });

  joyZone.addEventListener("touchend", () => {
    joyActive = false; joyVec = {x:0,y:0};
    joyBase.style.display = "none";
  });

  // ------------------------------------------------------------------
  // Recording (hold to record)
  // ------------------------------------------------------------------
  const recordBtn = document.getElementById("record-btn");
  const recordLabel = document.getElementById("record-label");
  let isRecording = false;
  let micAvailable = true;

  async function beginRecord(){
    if(isRecording) return;
    isRecording = true;
    recordBtn.classList.add("recording");
    recordLabel.textContent = "กำลังฟัง...";
    try{
      await startMicRecording();
    }catch(err){
      micAvailable = false;
      console.warn("mic unavailable, will use fallback", err);
    }
  }

  async function endRecord(){
    if(!isRecording) return;
    isRecording = false;
    recordBtn.classList.remove("recording");
    recordLabel.textContent = "กดค้างเพื่อพูด";

    let arrayBuffer, textHint = "";
    if(micAvailable && mediaRecorder){
      arrayBuffer = await stopMicRecording();
      if(!arrayBuffer || arrayBuffer.byteLength < 800){
        // too short / empty, fall back
        arrayBuffer = null;
      }
    }
    if(!arrayBuffer){
      textHint = prompt("ไม่มีเสียงอัดได้ พิมพ์อะไรสักอย่างแทนก็ได้:", "") || "echo";
      arrayBuffer = await synthesizeFromText(textHint);
    }

    // place new memory a short distance in front of the player, with jitter
    const forward = new THREE.Vector3(0,0,-1).applyQuaternion(yawGroup.quaternion);
    const jitter = new THREE.Vector3((Math.random()-0.5)*3, (Math.random()-0.5)*1.6, (Math.random()-0.5)*3);
    const pos = yawGroup.position.clone().add(forward.multiplyScalar(3)).add(jitter);

    const mem = {
      id: "mem_" + Date.now(),
      x: pos.x, y: pos.y, z: pos.z,
      createdAt: new Date().toISOString(),
      textHint: textHint,
      audio: arrayBuffer
    };
    await putMemory(mem);
    addMemoryToScene(mem);

    if(navigator.vibrate) navigator.vibrate([30, 40, 30]);
  }

  recordBtn.addEventListener("touchstart", (e) => { e.preventDefault(); beginRecord(); }, { passive:false });
  recordBtn.addEventListener("touchend", (e) => { e.preventDefault(); endRecord(); }, { passive:false });
  recordBtn.addEventListener("mousedown", beginRecord);
  recordBtn.addEventListener("mouseup", endRecord);

  // ------------------------------------------------------------------
  // Proximity + playback
  // ------------------------------------------------------------------
  const caption = document.getElementById("memory-caption");
  const PLAY_RADIUS = 1.6;
  const COOLDOWN = 3000;
  const lastPlayed = {};

  function checkProximity(){
    let nearAny = null;
    for(const m of memoryMeshes){
      const d = yawGroup.position.distanceTo(m.group.position);
      const near = d < PLAY_RADIUS * 1.8;
      m.glow.material.opacity = near ? 1.0 : 0.6;
      m.glow.material.map = near ? glowTexEmber : glowTexBlue;
      m.glow.scale.setScalar(near ? 1.8 + Math.sin(Date.now()*0.006)*0.15 : 1.4);

      if(d < PLAY_RADIUS){
        nearAny = m;
        const now = Date.now();
        if(!lastPlayed[m.data.id] || now - lastPlayed[m.data.id] > COOLDOWN){
          lastPlayed[m.data.id] = now;
          playWithEcho(m.data.audio);
          if(navigator.vibrate) navigator.vibrate(18);
        }
      }
    }
    if(nearAny){
      const label = nearAny.data.textHint ? nearAny.data.textHint : new Date(nearAny.data.createdAt).toLocaleString("th-TH");
      caption.textContent = label;
      caption.classList.add("show");
    } else {
      caption.classList.remove("show");
    }
  }

  // ------------------------------------------------------------------
  // Main loop
  // ------------------------------------------------------------------
  const clock = new THREE.Clock();
  const MOVE_SPEED = 2.6;

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, clock.getDelta());

    yawGroup.rotation.y = yaw + (gyroEnabled ? gyroYaw : 0);
    pitchGroup.rotation.x = pitch + (gyroEnabled ? gyroPitch : 0);

    if(joyVec.x !== 0 || joyVec.y !== 0){
      const forward = new THREE.Vector3(0,0,-1).applyEuler(new THREE.Euler(0, yawGroup.rotation.y, 0));
      const right = new THREE.Vector3(1,0,0).applyEuler(new THREE.Euler(0, yawGroup.rotation.y, 0));
      const move = new THREE.Vector3();
      move.addScaledVector(forward, -joyVec.y);
      move.addScaledVector(right, joyVec.x);
      if(move.lengthSq() > 0) move.normalize().multiplyScalar(MOVE_SPEED * dt);
      yawGroup.position.add(move);
    }

    for(const m of memoryMeshes){
      m.core.rotation.y += dt * 0.4;
    }

    checkProximity();
    renderer.render(scene, camera);
  }

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  async function boot(){
    db = await openDB();
    const existing = await getAllMemories();
    existing.forEach(addMemoryToScene);
    animate();
  }
  boot();

  document.getElementById("enter-btn").addEventListener("click", () => {
    document.getElementById("intro").classList.add("hidden");
    getAudioCtx().resume().catch(()=>{});
  });

})();
</script>
</body>
</html>
